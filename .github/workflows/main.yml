name: Compilar APK Lotofacil Engrossando o Talo

on:
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Lotofacil Talo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle :app:assembleDebug --stacktrace

      - run: test -s app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LOTOFACIL-ENGROSSANDO-O-TALO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
